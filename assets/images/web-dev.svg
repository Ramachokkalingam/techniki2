<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="webGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#1f2937"/>
  
  <!-- Browser Window -->
  <g transform="translate(100, 100)">
    <!-- Window frame -->
    <rect width="600" height="400" rx="10" fill="#374151" stroke="#6b7280" stroke-width="2"/>
    
    <!-- Title bar -->
    <rect width="600" height="40" rx="10" fill="#4b5563"/>
    <rect y="40" width="600" height="360" fill="#1f2937"/>
    
    <!-- Traffic lights -->
    <circle cx="20" cy="20" r="6" fill="#ef4444"/>
    <circle cx="40" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="20" r="6" fill="#10b981"/>
    
    <!-- URL bar -->
    <rect x="100" y="10" width="400" height="20" rx="10" fill="#374151"/>
    <text x="110" y="23" fill="#9ca3af" font-size="10">https://techniki.dev</text>
    
    <!-- Web content -->
    <g transform="translate(20, 60)">
      <!-- Header -->
      <rect width="560" height="60" fill="url(#webGradient)" opacity="0.8"/>
      <text x="280" y="35" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Techनिकी</text>
      
      <!-- Navigation -->
      <rect y="70" width="560" height="30" fill="#4b5563"/>
      <g fill="#d1d5db" font-size="12">
        <text x="20" y="88">Home</text>
        <text x="80" y="88">About</text>
        <text x="140" y="88">Projects</text>
        <text x="220" y="88">Contact</text>
      </g>
      
      <!-- Content sections -->
      <rect y="120" width="270" height="120" fill="#3b82f6" opacity="0.3"/>
      <rect x="290" y="120" width="270" height="120" fill="#8b5cf6" opacity="0.3"/>
      
      <!-- Code snippets -->
      <g fill="#10b981" font-family="monospace" font-size="10">
        <text x="30" y="140">&lt;div className="hero"&gt;</text>
        <text x="30" y="155">  &lt;h1&gt;Welcome&lt;/h1&gt;</text>
        <text x="30" y="170">&lt;/div&gt;</text>
        
        <text x="320" y="140">const tech = {</text>
        <text x="320" y="155">  react: true,</text>
        <text x="320" y="170">  node: true</text>
        <text x="320" y="185">}</text>
      </g>
      
      <!-- Bottom content -->
      <rect y="260" width="560" height="80" fill="#059669" opacity="0.2"/>
    </g>
  </g>
  
  <!-- Code elements around the browser -->
  <g fill="#6b7280" font-family="monospace" font-size="12" opacity="0.5">
    <text x="50" y="50">React.js</text>
    <text x="700" y="100">Node.js</text>
    <text x="50" y="550">HTML5</text>
    <text x="700" y="550">CSS3</text>
  </g>
  
  <!-- Tech icons -->
  <g transform="translate(50, 200)">
    <rect width="40" height="40" rx="5" fill="#61dafb" opacity="0.7"/>
    <text x="20" y="25" text-anchor="middle" fill="white" font-size="12">⚛</text>
  </g>
  
  <g transform="translate(710, 300)">
    <rect width="40" height="40" rx="5" fill="#68a063" opacity="0.7"/>
    <text x="20" y="25" text-anchor="middle" fill="white" font-size="20">N</text>
  </g>
</svg>

<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vrGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="immersiveGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#1f2937"/>
  
  <!-- VR Headset -->
  <g transform="translate(300, 200)">
    <!-- Main body -->
    <ellipse cx="100" cy="50" rx="80" ry="40" fill="#374151"/>
    <ellipse cx="100" cy="50" rx="70" ry="35" fill="#4b5563"/>
    
    <!-- Lenses -->
    <circle cx="70" cy="50" r="25" fill="#111827"/>
    <circle cx="130" cy="50" r="25" fill="#111827"/>
    
    <!-- Lens reflections/displays -->
    <circle cx="70" cy="50" r="20" fill="url(#vrGradient)" opacity="0.8"/>
    <circle cx="130" cy="50" r="20" fill="url(#vrGradient)" opacity="0.8"/>
    
    <!-- Inner display effect -->
    <circle cx="70" cy="45" r="15" fill="#fbbf24" opacity="0.6"/>
    <circle cx="130" cy="45" r="15" fill="#fbbf24" opacity="0.6"/>
    
    <!-- Head strap -->
    <rect x="-20" y="40" width="25" height="20" rx="10" fill="#6b7280"/>
    <rect x="195" y="40" width="25" height="20" rx="10" fill="#6b7280"/>
    
    <!-- Top strap -->
    <path d="M 50 20 Q 100 10 150 20" stroke="#6b7280" stroke-width="8" fill="none"/>
    
    <!-- Sensors -->
    <circle cx="50" cy="30" r="3" fill="#3b82f6"/>
    <circle cx="150" cy="30" r="3" fill="#3b82f6"/>
    <circle cx="100" cy="25" r="3" fill="#3b82f6"/>
  </g>
  
  <!-- Virtual World Representation -->
  <g transform="translate(100, 350)">
    <!-- Virtual landscape -->
    <ellipse cx="300" cy="100" rx="250" ry="80" fill="url(#immersiveGradient)"/>
    
    <!-- Virtual objects -->
    <g opacity="0.8">
      <!-- Buildings -->
      <rect x="150" y="60" width="30" height="40" fill="#8b5cf6"/>
      <rect x="200" y="50" width="40" height="50" fill="#3b82f6"/>
      <rect x="270" y="55" width="35" height="45" fill="#10b981"/>
      <rect x="350" y="45" width="45" height="55" fill="#f59e0b"/>
      
      <!-- Trees/Nature -->
      <circle cx="120" cy="80" r="15" fill="#059669"/>
      <rect x="115" y="80" width="10" height="20" fill="#92400e"/>
      
      <circle cx="420" cy="85" r="12" fill="#059669"/>
      <rect x="416" y="85" width="8" height="15" fill="#92400e"/>
    </g>
    
    <!-- Virtual UI elements -->
    <rect x="50" y="40" width="80" height="20" fill="#1f2937" opacity="0.8"/>
    <text x="90" y="53" text-anchor="middle" fill="#ffffff" font-size="12">Virtual Menu</text>
    
    <rect x="450" y="30" width="100" height="25" fill="#1f2937" opacity="0.8"/>
    <text x="500" y="46" text-anchor="middle" fill="#ffffff" font-size="12">3D Controls</text>
  </g>
  
  <!-- Hand controllers -->
  <g transform="translate(150, 150)">
    <!-- Left controller -->
    <ellipse cx="0" cy="50" rx="15" ry="30" fill="#6b7280"/>
    <circle cx="0" cy="40" r="5" fill="#3b82f6"/>
    <rect x="-3" y="55" width="6" height="15" fill="#4b5563"/>
    
    <!-- Right controller -->
    <ellipse cx="400" cy="50" rx="15" ry="30" fill="#6b7280"/>
    <circle cx="400" cy="40" r="5" fill="#ef4444"/>
    <rect x="397" y="55" width="6" height="15" fill="#4b5563"/>
  </g>
  
  <!-- Motion tracking visualization -->
  <g stroke="#06b6d4" fill="none" stroke-width="2" opacity="0.4">
    <path d="M 150 200 Q 200 180 250 200"/>
    <path d="M 550 200 Q 500 180 450 200"/>
    <circle cx="150" cy="200" r="3" fill="#06b6d4"/>
    <circle cx="550" cy="200" r="3" fill="#06b6d4"/>
  </g>
  
  <!-- VR Space boundaries -->
  <g stroke="#8b5cf6" fill="none" stroke-width="2" opacity="0.3" stroke-dasharray="5,5">
    <rect x="50" y="100" width="700" height="400"/>
  </g>
  
  <!-- 360° indicators -->
  <g transform="translate(400, 50)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" fill="#fbbf24" font-size="12">360°</text>
  </g>
  
  <!-- Immersive text labels -->
  <g fill="#9ca3af" font-size="14" opacity="0.7">
    <text x="50" y="50">Immersive</text>
    <text x="650" y="80">Virtual Reality</text>
    <text x="100" y="580">Full Body Tracking</text>
    <text x="550" y="580">Spatial Audio</text>
  </g>
</svg>

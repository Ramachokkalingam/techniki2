<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="virtualGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#1f2937"/>
  
  <!-- Phone/Device outline -->
  <g transform="translate(300, 150)">
    <rect width="200" height="300" rx="20" fill="#374151" stroke="#6b7280" stroke-width="2"/>
    <rect x="10" y="30" width="180" height="240" fill="#111827"/>
    
    <!-- Screen content with AR overlay -->
    <!-- Real world view -->
    <rect x="10" y="30" width="180" height="240" fill="#4b5563"/>
    
    <!-- AR overlay elements -->
    <circle cx="60" cy="100" r="20" fill="url(#arGradient)" opacity="0.8"/>
    <text x="60" y="105" text-anchor="middle" fill="white" font-size="10">AR</text>
    
    <rect x="110" y="80" width="60" height="40" fill="url(#virtualGradient)" opacity="0.7"/>
    <text x="140" y="105" text-anchor="middle" fill="white" font-size="8">3D OBJ</text>
    
    <!-- AR tracking points -->
    <g stroke="#10b981" fill="none" stroke-width="2">
      <circle cx="30" cy="150" r="3"/>
      <circle cx="170" cy="180" r="3"/>
      <circle cx="80" cy="200" r="3"/>
      <circle cx="150" cy="220" r="3"/>
      
      <!-- Tracking lines -->
      <line x1="30" y1="150" x2="80" y2="200" opacity="0.5"/>
      <line x1="170" y1="180" x2="150" y2="220" opacity="0.5"/>
    </g>
    
    <!-- Virtual UI elements -->
    <rect x="15" y="240" width="30" height="20" fill="#3b82f6" opacity="0.8"/>
    <text x="30" y="253" text-anchor="middle" fill="white" font-size="8">UI</text>
    
    <rect x="155" y="240" width="30" height="20" fill="#8b5cf6" opacity="0.8"/>
    <text x="170" y="253" text-anchor="middle" fill="white" font-size="8">3D</text>
  </g>
  
  <!-- 3D cube representation -->
  <g transform="translate(600, 200)">
    <!-- Cube faces -->
    <polygon points="0,0 60,0 60,60 0,60" fill="#10b981" opacity="0.8"/>
    <polygon points="60,0 90,30 90,90 60,60" fill="#059669" opacity="0.6"/>
    <polygon points="0,60 30,90 90,90 60,60" fill="#047857" opacity="0.7"/>
    
    <!-- Wireframe -->
    <g stroke="#ffffff" fill="none" stroke-width="1" opacity="0.3">
      <polygon points="0,0 60,0 60,60 0,60"/>
      <polygon points="60,0 90,30 90,90 60,60"/>
      <polygon points="0,60 30,90 90,90 60,60"/>
      <line x1="0" y1="0" x2="30" y2="30"/>
      <line x1="60" y1="0" x2="90" y2="30"/>
      <line x1="0" y1="60" x2="30" y2="90"/>
    </g>
  </g>
  
  <!-- AR glasses/headset -->
  <g transform="translate(100, 100)">
    <ellipse cx="40" cy="30" rx="35" ry="25" fill="#4b5563" opacity="0.8"/>
    <ellipse cx="40" cy="30" rx="25" ry="18" fill="#111827"/>
    <rect x="75" y="25" width="30" height="10" fill="#4b5563"/>
    
    <!-- Lens reflection -->
    <ellipse cx="40" cy="25" rx="15" ry="10" fill="#06b6d4" opacity="0.3"/>
  </g>
  
  <!-- Floating AR elements -->
  <g transform="translate(150, 400)">
    <rect width="50" height="30" fill="url(#virtualGradient)" opacity="0.6"/>
    <text x="25" y="20" text-anchor="middle" fill="white" font-size="12">AR SDK</text>
  </g>
  
  <g transform="translate(500, 450)">
    <polygon points="25,0 50,25 25,50 0,25" fill="#10b981" opacity="0.7"/>
    <text x="25" y="30" text-anchor="middle" fill="white" font-size="10">3D</text>
  </g>
  
  <!-- Background tech pattern -->
  <g stroke="#374151" fill="none" stroke-width="1" opacity="0.2">
    <circle cx="50" cy="300" r="30"/>
    <circle cx="750" cy="500" r="40"/>
    <rect x="20" y="500" width="40" height="40" transform="rotate(45 40 520)"/>
  </g>
</svg>

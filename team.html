    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111827;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(59, 130, 246, 0.1) 0%, rgba(147, 51, 234, 0.1) 100%);
            z-index: -1;
        }

        /* Navigation Styles */
        #navbar {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-link {
            position: relative;
            overflow: hidden;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #9333ea);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .join-btn:hover {
            transform: translateY(-2px);
        }

        .about-title {
            font-size: 7.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            white-space: nowrap;
            font-family: "Arial Black", "Arial Bold", Arial, sans-serif;
            background: linear-gradient(
                135deg,
                rgba(59, 130, 246, 0.4) 0%,
                rgba(147, 51, 234, 0.4) 50%,
                rgba(255, 255, 255, 0.1) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
            }
            to {
                text-shadow: 0 0 60px rgba(147, 51, 234, 0.4), 0 0 80px rgba(59, 130, 246, 0.2);
            }
        }

        .carousel-container {
            width: 100%;
            max-width: 1200px;
            height: 450px;
            position: relative;
            perspective: 1000px;
            margin-top: 200px;
        }

        .carousel-track {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .card {
            position: absolute;
            width: 280px;
            height: 380px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }

        .card img {
            width: 100%;
            height: calc(100% - 60px);
            object-fit: cover;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: linear-gradient(135deg, #3b82f6, #9333ea);
        }

        .card.center {
            z-index: 10;
            transform: scale(1.1) translateZ(0);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(59, 130, 246, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 0 40px rgba(59, 130, 246, 0.2);
        }

        .card.center img {
            filter: none;
        }

        .card.left-2 {
            z-index: 1;
            transform: translateX(-400px) scale(0.8) translateZ(-300px);
            opacity: 0.7;
        }

        .card.left-2 img {
            filter: grayscale(80%) brightness(0.7);
        }

        .card.left-1 {
            z-index: 5;
            transform: translateX(-200px) scale(0.9) translateZ(-100px);
            opacity: 0.9;
        }

        .card.left-1 img {
            filter: grayscale(50%) brightness(0.8);
        }

        .card.right-1 {
            z-index: 5;
            transform: translateX(200px) scale(0.9) translateZ(-100px);
            opacity: 0.9;
        }

        .card.right-1 img {
            filter: grayscale(50%) brightness(0.8);
        }

        .card.right-2 {
            z-index: 1;
            transform: translateX(400px) scale(0.8) translateZ(-300px);
            opacity: 0.7;
        }

        .card.right-2 img {
            filter: grayscale(80%) brightness(0.7);
        }

        .card.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .card .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            height: 60px;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card .social-links li {
            list-style: none;
        }

        .card .social-links a {
            font-size: 1.5rem;
            color: rgba(59, 130, 246, 0.9);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(10px);
        }

        .card .social-links a:hover {
            color: #fff;
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            transform: translateY(-2px) scale(1.1);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .member-info {
            text-align: center;
            margin-top: 40px;
            transition: all 0.5s ease-out;
            padding: 0 20px;
        }

        .member-name {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
            text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }

        .member-name::before,
        .member-name::after {
            content: "";
            position: absolute;
            top: 100%;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3b82f6, #9333ea, transparent);
            animation: shimmer 2s ease-in-out infinite alternate;
        }

        .member-name::before {
            left: -120px;
        }

        .member-name::after {
            right: -120px;
        }

        @keyframes shimmer {
            from {
                opacity: 0.5;
            }
            to {
                opacity: 1;
            }
        }

        .member-role {
            color: rgba(148, 163, 184, 0.9);
            font-size: 1.5rem;
            font-weight: 500;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 10px 0;
            margin-top: -15px;
            position: relative;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 60px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .dot.active {
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s ease;
            font-size: 1.5rem;
            outline: none;
            padding-bottom: 4px;
        }

        .nav-arrow:hover {
            background: rgba(59, 130, 246, 0.4);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .nav-arrow.left {
            left: 20px;
            padding-right: 3px;
        }

        .nav-arrow.right {
            right: 20px;
            padding-left: 3px;
        }

        /* Floating particles animation */
        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.1;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.3;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile menu toggle */
        #mobile-menu {
            transform: translateY(-100%);
        }

        #mobile-menu.show {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .about-title {
                font-size: 4.5rem;
                top: 100px;
            }

            .carousel-container {
                margin-top: 180px;
            }

            .card {
                width: 200px;
                height: 280px;
            }

            .card.left-2 {
                transform: translateX(-250px) scale(0.8) translateZ(-300px);
            }

            .card.left-1 {
                transform: translateX(-120px) scale(0.9) translateZ(-100px);
            }

            .card.right-1 {
                transform: translateX(120px) scale(0.9) translateZ(-100px);
            }

            .card.right-2 {
                transform: translateX(250px) scale(0.8) translateZ(-300px);
            }

            .member-name {
                font-size: 2rem;
            }

            .member-role {
                font-size: 1.2rem;
            }

            .member-name::before,
            .member-name::after {
                width: 50px;
            }

            .member-name::before {
                left: -70px;
            }

            .member-name::after {
                right: -70px;
            }

            .card .social-links a {
                font-size: 1.2rem;
                width: 35px;
                height: 35px;
            }

            .nav-arrow {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .nav-arrow.left {
                left: 10px;
            }

            .nav-arrow.right {
                right: 10px;
            }
        }

        @media (max-width: 480px) {
            .about-title {
                font-size: 3rem;
            }

            .dots {
                gap: 8px;
                padding: 15px;
            }

            .dot {
                width: 10px;
                height: 10px;
            }
        }
    </style>
</head>

    <script>
        // Initialize AOS animations
        AOS.init({
            duration: 1000,
            easing: 'ease-in-out',
            once: true,
            mirror: false
        });

        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize VANTA.NET background
        let vantaEffect;
        function initVanta() {
            if (typeof VANTA !== 'undefined') {
                vantaEffect = VANTA.NET({
                    el: "#vanta-bg",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    scale: 1.00,
                    scaleMobile: 1.00,
                    color: 0x3b82f6,
                    backgroundColor: 0x111827,
                    points: 15.00,
                    maxDistance: 25.00,
                    spacing: 18.00
                });
            }
        }

        // Mobile menu toggle
        const menuButton = document.getElementById('menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        
        menuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('show');
            const icon = menuButton.querySelector('i');
            if (mobileMenu.classList.contains('show')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        });

        // Hide loading overlay and initialize
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('loading-overlay').classList.add('hidden');
                createParticles();
                initVanta();
            }, 1000);
        });

        // Carousel functionality
        let currentIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        const cards = document.querySelectorAll('.card');
        const dots = document.querySelectorAll('.dot');
        const leftArrow = document.querySelector('.nav-arrow.left');
        const rightArrow = document.querySelector('.nav-arrow.right');
        const memberName = document.querySelector('.member-name');
        const memberRole = document.querySelector('.member-role');

        const teamData = [
            { name: "Sazzan", role: "President" },
            { name: "Reetunjai", role: "Vice President" },
            { name: "Priyanshi", role: "Tech Core" },
            { name: "Sampriya", role: "Tech Core" },
            { name: "Kabir", role: "Tech Core" },
            { name: "Sahib", role: "Tech Core" },
            { name: "Yash", role: "Tech Core" },
            { name: "Ansh", role: "Tech Core" },
            { name: "Saksham", role: "Tech Core" },
            { name: "Prachi", role: "Tech Core" },
            { name: "Immanuel", role: "Tech Core" },
            { name: "Kunal", role: "Tech Core" }
        ];

        function updateCarousel(newIndex) {
            if (newIndex < 0) {
                newIndex = cards.length - 1;
            } else if (newIndex >= cards.length) {
                newIndex = 0;
            }

            currentIndex = newIndex;

            cards.forEach((card, index) => {
                card.className = 'card';
                
                const position = (index - currentIndex + cards.length) % cards.length;
                
                if (position === 0) {
                    card.classList.add('center');
                } else if (position === 1) {
                    card.classList.add('right-1');
                } else if (position === 2) {
                    card.classList.add('right-2');
                } else if (position === cards.length - 1) {
                    card.classList.add('left-1');
                } else if (position === cards.length - 2) {
                    card.classList.add('left-2');
                } else {
                    card.classList.add('hidden');
                }
            });

            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });

            memberName.textContent = teamData[currentIndex].name;
            memberRole.textContent = teamData[currentIndex].role;
        }

        leftArrow.addEventListener('click', () => {
            updateCarousel(currentIndex - 1);
        });

        rightArrow.addEventListener('click', () => {
            updateCarousel(currentIndex + 1);
        });

        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                updateCarousel(index);
            });
        });

        cards.forEach((card, index) => {
            card.addEventListener('click', () => {
                updateCarousel(index);
            });
        });

        // Touch/swipe support
        document.addEventListener("touchstart", (e) => {
            touchStartX = e.touches[0].screenX;
        });

        document.addEventListener("touchend", (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    updateCarousel(currentIndex + 1);
                } else {
                    updateCarousel(currentIndex - 1);
                }
            }
        }

        // Auto-play functionality
        let autoPlayInterval;
        function startAutoPlay() {
            autoPlayInterval = setInterval(() => {
                updateCarousel(currentIndex + 1);
            }, 4000);
        }

        function stopAutoPlay() {
            clearInterval(autoPlayInterval);
        }

        // Start auto-play when page loads
        setTimeout(startAutoPlay, 2000);

        // Pause auto-play on hover
        const carouselContainer = document.querySelector('.carousel-container');
        carouselContainer.addEventListener('mouseenter', stopAutoPlay);
        carouselContainer.addEventListener('mouseleave', startAutoPlay);

        // Initialize the carousel
        updateCarousel(0);

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(17, 24, 39, 0.98)';
                navbar.style.backdropFilter = 'blur(20px)';
            } else {
                navbar.style.background = 'rgba(17, 24, 39, 0.95)';
                navbar.style.backdropFilter = 'blur(20px)';
            }
        });
    </script>
